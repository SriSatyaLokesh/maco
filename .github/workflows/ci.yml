name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The mirror in .agents/skills/ is what 5 of 6 hosts actually load. A
      # stale mirror means the marketplace ships skills that differ from the
      # ones in the repo, and nobody notices until a contributor installs the
      # wrong version.
      - name: Check skill mirror is in sync
        run: npm run check

      - name: Validate skills, marketplace manifest and config
        run: npm run validate

      - name: Verify the two JSON entry points parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('maco.json'));"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'));"
          node -e "JSON.parse(require('fs').readFileSync('plugins/maco/.claude-plugin/plugin.json'));"

      - name: Parse consumer workflow templates
        run: |
          # The .github/workflows here are templates shipped to consumers, not
          # runs of this repo. A YAML syntax error in them is invisible until
          # someone installs MACO.
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              print("pyyaml unavailable, skipping")
              sys.exit(0)
          bad = []
          for f in glob.glob(".github/workflows/*.yml"):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("workflow templates parse")
          PY
